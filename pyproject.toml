[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-video-harness"
version = "0.1.0"
description = "Reusable Manim components and harness for 3b1b-style technical explainers"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["lib", "lib.components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
